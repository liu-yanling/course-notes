name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-docx
        run: python3 -m pip install --upgrade pip python-docx
      - name: Run tests
        env:
          COURSE_NOTES_PYTHON: python3
        run: npm test
